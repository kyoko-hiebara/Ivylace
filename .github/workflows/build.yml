name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PLUGIN_NAME: ivylace

jobs:
  build:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-latest
            targets: "x86_64-apple-darwin aarch64-apple-darwin"
            bundle_args: "--release"
            universal: true

          - name: Windows
            os: windows-latest
            targets: "x86_64-pc-windows-msvc"
            bundle_args: "--release"
            universal: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # macOS Universal Binary: build for both architectures and combine
      - name: Build macOS Universal
        if: matrix.universal
        run: |
          cargo xtask bundle "$PLUGIN_NAME" --release --target x86_64-apple-darwin
          cargo xtask bundle "$PLUGIN_NAME" --release --target aarch64-apple-darwin

          # Create universal binaries
          mkdir -p target/bundled-universal

          # VST3
          cp -r "target/bundled/${PLUGIN_NAME}.vst3" "target/bundled-universal/${PLUGIN_NAME}.vst3"
          INTEL_VST3=$(find "target/x86_64-apple-darwin/bundled/${PLUGIN_NAME}.vst3" -name "*.dylib" -o -name "${PLUGIN_NAME}" -type f | head -1)
          ARM_VST3=$(find "target/aarch64-apple-darwin/bundled/${PLUGIN_NAME}.vst3" -name "*.dylib" -o -name "${PLUGIN_NAME}" -type f | head -1)
          if [ -n "$INTEL_VST3" ] && [ -n "$ARM_VST3" ]; then
            UNIVERSAL_VST3=$(echo "$ARM_VST3" | sed "s|target/aarch64-apple-darwin/bundled|target/bundled-universal|")
            mkdir -p "$(dirname "$UNIVERSAL_VST3")"
            lipo -create "$INTEL_VST3" "$ARM_VST3" -output "$UNIVERSAL_VST3"
          fi

          # CLAP
          INTEL_CLAP="target/x86_64-apple-darwin/bundled/${PLUGIN_NAME}.clap"
          ARM_CLAP="target/aarch64-apple-darwin/bundled/${PLUGIN_NAME}.clap"
          if [ -f "$INTEL_CLAP" ] && [ -f "$ARM_CLAP" ]; then
            lipo -create "$INTEL_CLAP" "$ARM_CLAP" -output "target/bundled-universal/${PLUGIN_NAME}.clap"
          fi

      # Windows: standard build
      - name: Build
        if: "!matrix.universal"
        run: cargo xtask bundle ${{ env.PLUGIN_NAME }} ${{ matrix.bundle_args }}

      # Package artifacts
      - name: Package (macOS Universal)
        if: matrix.universal
        run: |
          cd target/bundled-universal
          zip -r "../../${PLUGIN_NAME}-macOS-universal.zip" "${PLUGIN_NAME}.vst3" "${PLUGIN_NAME}.clap"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/bundled
          7z a "../../${PLUGIN_NAME}-Windows-x64.zip" "${PLUGIN_NAME}.vst3" "${PLUGIN_NAME}.clap"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ matrix.name }}
          path: ${{ env.PLUGIN_NAME }}-*.zip

  # Create GitHub Release when a version tag is pushed
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: "*.zip"
